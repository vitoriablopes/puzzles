<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Quebra-cabeça</title>
<meta name="theme-color" content="#2a2a2d">
<meta name="description" content="Monte quebra-cabeças com fotos livres ou com a sua própria imagem.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quebra-cabeça">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{
  --bg:#2a2a2d; --bg2:#202023; --panel:#323236; --line:#47474d;
  --hud:rgba(50,50,54,.88); --hud-hover:rgba(74,74,80,.95); --hover:#44444a; --grip:#5a5a62; --thumb:#5f5f67;
  --frame-fill:rgba(255,255,255,.035); --frame-line:rgba(255,255,255,.16); --veil:rgba(20,20,22,.82);
  --text:#ececef; --muted:#9c9ca6; --accent:#f2b84b; --accent-ink:#2a1f05;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --cols:1; --trayW:150px; --trayH:220px;
}
:root.light{
  --bg:#e9e9ec; --bg2:#dcdce1; --panel:#f8f8fa; --line:#bdbdc6; --text:#1f1f23; --muted:#62626c; --accent:#e8a21f;
  --hud:rgba(255,255,255,.92); --hud-hover:#fff; --hover:#ececf0; --grip:#a9a9b3; --thumb:#a0a0aa;
  --frame-fill:rgba(0,0,0,.04); --frame-line:rgba(0,0,0,.22); --veil:rgba(233,233,236,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
input,button{-webkit-user-select:auto;user-select:auto}
[hidden]{display:none!important}

/* ---------- área de jogo ---------- */
#work{position:fixed;inset:0;display:flex;flex-direction:row;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:var(--bg)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#frame{position:absolute;left:0;top:0;background:var(--frame-fill);outline:4px dashed var(--frame-line)}
#ghost{position:absolute;left:0;top:0;opacity:0;transition:opacity .9s;pointer-events:none;z-index:0}
body.guide #ghost{opacity:.22}
#world.complete #ghost{opacity:1;z-index:5}
.wp{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.wp.lift{filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.wp.locked{filter:none;z-index:1}
.wp.flash{filter:brightness(1.45)}

#hud{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:30;max-width:calc(100% - 20px)}
.ib,.chip{height:38px;border-radius:12px;border:1px solid var(--line);background:var(--hud);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:inline-flex;align-items:center;justify-content:center}
.ib{width:38px;padding:0}
.ib:hover,.ib.on{background:var(--hud-hover)}
.ib.on{border-color:var(--accent);color:var(--accent)}
.chip{padding:0 12px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);z-index:300;
  background:#111;color:#ececef;border:1px solid #47474d;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);
  text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

/* ---------- bandeja ---------- */
#resizer{flex:none;width:16px;margin:0 -8px;z-index:20;cursor:col-resize;touch-action:none;position:relative}
#resizer::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:48px;border-radius:2px;
  background:var(--grip);transform:translate(-50%,-50%)}
#resizer:hover::after,#resizer.drag::after{background:var(--accent)}
#tray{flex:none;width:var(--trayW);display:flex;flex-direction:column;min-height:0;background:var(--bg2);
  border-left:1px solid var(--line)}
#tray.drop{outline:2px solid var(--accent);outline-offset:-2px}
#trayHead{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;color:var(--muted);
  border-bottom:1px solid var(--line);flex:none}
#trayHead .lbl{flex:1;white-space:nowrap}
#trayHead b{color:var(--text)}
#trayHead button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  font-size:16px;line-height:1;padding:0}
#trayHead button:hover{background:var(--hover)}
#trayList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;padding:8px;align-content:start;
  touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:auto;scrollbar-color:var(--thumb) transparent}
#trayList::-webkit-scrollbar{width:12px}
#trayList::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:6px;border:3px solid var(--bg2)}
.tp{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab;-webkit-user-drag:none}
#tray.few .tp{filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.tp.src{visibility:hidden}
.floating{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
#trayEmpty{grid-column:1/-1;color:var(--muted);font-size:13px;text-align:center;padding:16px 4px}

body.portrait #work{flex-direction:column}
body.portrait #resizer{width:auto;height:30px;margin:-15px 0;cursor:row-resize}
body.portrait #resizer::after{width:56px;height:4px}
body.portrait #tray{width:auto;height:var(--trayH);border-left:0;border-top:1px solid var(--line)}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal)}
#menu header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
#menu h1{font-size:20px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:550}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#menuScroll{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch;user-select:none}
.wrap{max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.tabs button.active{background:var(--panel);color:var(--text);border-color:#6a6a72}
#searchForm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#q{flex:1;min-width:180px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:0 12px;font-size:16px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#chips button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted)}
#chips button:hover{color:var(--text);border-color:#6a6a72}
#chips button.on{background:var(--panel);color:var(--text);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{position:relative;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--bg2);aspect-ratio:4/3}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:hover{border-color:#6a6a72}
.th.sel{border-color:var(--accent)}
#gstatus{color:var(--muted);font-size:14px;margin:14px 0;text-align:center;min-height:20px}
#btnMore{display:block;margin:0 auto 10px}
.note{color:var(--muted);font-size:12.5px;text-align:center;margin:8px 0 0}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  border:2px dashed #5a5a62;border-radius:18px;min-height:240px;padding:24px;color:var(--muted);cursor:pointer}
#drop.over{border-color:var(--accent);color:var(--text);background:rgba(242,184,75,.06)}
#drop strong{color:var(--text);font-size:17px}
#file{display:none}

#menuFoot{flex:none;border-top:1px solid var(--line);background:var(--bg2);padding:12px 18px calc(12px + var(--sab));
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#sel{display:flex;gap:10px;align-items:center;flex:1 1 240px;min-width:0}
#selThumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel);flex:none}
#selText{min-width:0}
#selTitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selCredit{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selCredit a{color:var(--muted)}
#countBox{flex:1 1 240px;min-width:200px}
#countBox label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
#countBox label b{color:var(--text)}
#count{width:100%;accent-color:var(--accent);height:26px;margin:0}

/* ---------- carregando / final ---------- */
.overlay2{position:fixed;inset:0;z-index:200;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0;color:var(--muted)}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:14px}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
#doneCredit{font-size:12px}
#doneCredit a{color:var(--muted)}
.wp,.tp{transition:transform .15s}
#source{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:0 10px;font-size:15px}
.srcrow{display:flex;gap:8px;margin-bottom:8px}
#diag{font-size:13px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;line-height:1.6}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:520px){ #menu header{padding:10px 12px} #menuScroll{padding:12px} #menuFoot{padding-left:12px;padding-right:12px} }
</style>
</head>
<body>

<div id="work">
  <div id="stage">
    <div id="world"><div id="frame"></div></div>
    <div id="hud">
      <button class="ib" id="btnMenu" title="Novo quebra-cabeça" aria-label="Novo quebra-cabeça">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="chip" title="Peças no lugar"><b id="hudPlaced">0</b>&nbsp;/&nbsp;<span id="hudTotal">0</span></span>
      <span class="chip" id="hudTime" title="Tempo" hidden>0:00</span>
      <button class="ib" id="btnTidy" title="Guardar peças soltas na bandeja" aria-label="Guardar peças soltas na bandeja">
        <svg viewBox="0 0 24 24"><path d="M4 14v5h16v-5M12 4v10M8 10l4 4 4-4"/></svg></button>
      <button class="ib" id="btnGuide" title="Mostrar/ocultar imagem de guia" aria-label="Guia">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ib" id="btnTime" title="Mostrar/ocultar o tempo" aria-label="Tempo">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
      <button class="ib" id="btnZoomOut" title="Reduzir" aria-label="Reduzir">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
      <button class="ib" id="btnZoomIn" title="Ampliar" aria-label="Ampliar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg></button>
      <button class="ib" id="btnFit" title="Ajustar à tela" aria-label="Ajustar à tela">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" id="btnTheme" title="Fundo claro/escuro" aria-label="Fundo claro/escuro">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div id="resizer" title="Arraste para redimensionar a bandeja" role="separator"></div>
  <aside id="tray">
    <div id="trayHead">
      <span class="lbl"><b id="trayCount">0</b> peças</span>
      <button id="colsLess" title="Menos colunas" aria-label="Menos colunas">−</button>
      <button id="colsMore" title="Mais colunas" aria-label="Mais colunas">+</button>
    </div>
    <div id="trayList"></div>
  </aside>
</div>
<div id="dragLayer"></div>

<!-- menu -->
<div id="menu">
  <header>
    <h1>Quebra-cabeça</h1>
    <button class="btn" id="btnThemeMenu" title="Fundo claro/escuro">◐ Tema</button>
    <button class="btn" id="btnInstall" hidden>Instalar app</button>
    <button class="btn" id="btnIosHint" hidden>Instalar</button>
    <button class="btn" id="btnCloseMenu" hidden>Voltar ao jogo</button>
  </header>
  <div id="menuScroll"><div class="wrap">
    <div class="tabs">
      <button class="active" data-tab="gallery">Galeria</button>
      <button data-tab="upload">Enviar imagem</button>
    </div>
    <section id="tabGallery">
      <div class="srcrow"><select id="source" aria-label="Banco de imagens"></select><button class="btn" type="button" id="btnDiag" title="Testa a conexão com cada galeria">Testar galerias</button></div>
      <div id="diag" hidden></div>
      <form id="searchForm">
        <input id="q" type="search" placeholder="Buscar imagens (ex.: montanha, flores, gato)" autocomplete="off" enterkeyhint="search">
        <button class="btn" type="submit">Buscar</button>
        <button class="btn" type="button" id="btnRandom" title="Sorteia uma imagem dentro da galeria e da busca escolhidas">🎲 Aleatória</button>
        <button class="btn" type="button" id="btnRandomAll" title="Sorteia de qualquer galeria e qualquer tema">🎲 Surpresa total</button>
      </form>
      <div id="chips"></div>
      <div id="grid"></div>
      <div id="gstatus"></div>
      <button class="btn" id="btnMore" hidden>Carregar mais</button>
      <p class="note" id="srcNote"></p>
    </section>
    <section id="tabUpload" hidden>
      <label id="drop" for="file">
        <strong>Toque para escolher uma imagem</strong>
        <span>ou arraste um arquivo até aqui (JPG, PNG, WebP…)</span>
      </label>
      <input id="file" type="file" accept="image/*">
      <p class="note">A imagem fica só no seu aparelho; nada é enviado a servidor algum.</p>
    </section>
  </div></div>
  <footer id="menuFoot">
    <div id="sel">
      <img id="selThumb" alt="">
      <div id="selText"><div id="selTitle">Nenhuma imagem escolhida</div><div id="selCredit">Escolha uma foto na galeria ou envie a sua</div></div>
    </div>
    <div id="countBox">
      <label><span>Número de peças</span><b id="countLabel"></b></label>
      <input id="count" type="range" min="0" max="13" step="1">
      <label class="opt"><input type="checkbox" id="optRotate"> Girar as peças (mais difícil; duplo clique/toque gira)</label>
    </div>
    <button class="btn primary" id="btnStart" disabled>Começar</button>
  </footer>
</div>

<div id="loading" class="overlay2" hidden>
  <div class="card"><h2 id="loadingText">Carregando…</h2><div id="bar"><i></i></div></div>
</div>
<div id="done" class="overlay2" hidden>
  <div class="card">
    <h2>Quebra-cabeça completo! 🎉</h2>
    <p id="doneStats"></p>
    <p id="doneCredit"></p>
    <div class="row">
      <button class="btn" id="doneClose">Ver o resultado</button>
      <button class="btn" id="doneAgain">Embaralhar de novo</button>
      <button class="btn primary" id="doneNew">Novo</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

/* ================= preferências (por navegador) ================= */
const LS_KEY = 'quebra-cabeca.prefs.v1';
const COUNTS = [12,24,35,48,63,80,100,150,200,300,400,500,750,1000];
const defaults = {countIdx:3, trayW:0, trayH:0, cellP:0, guide:false, query:'', label:'', rotate:false, showTime:false, theme:'dark', source:'commons-featured'};
let prefs = (() => { try { return {...defaults, ...JSON.parse(localStorage.getItem(LS_KEY)||'{}')}; } catch { return {...defaults}; } })();
const savePrefs = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch {} };

/* ================= elementos ================= */
const stage=$('#stage'), world=$('#world'), frame=$('#frame'), trayEl=$('#tray'), trayList=$('#trayList'),
      resizer=$('#resizer'), dragLayer=$('#dragLayer'), root=document.documentElement;

let toastT;
function toast(msg, ms=3500){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* ================= layout (bandeja) ================= */
const PADS = 30;                       // padding + barra de rolagem da bandeja
const isPortrait = () => matchMedia('(orientation: portrait)').matches;
const cellL = () => Math.round(clamp(innerWidth*0.09, 92, 130));
function applyLayout(){
  const portrait = isPortrait();
  document.body.classList.toggle('portrait', portrait);
  let cols;
  if(!portrait){
    const cell = cellL();
    const minW = cell+PADS, maxW = Math.max(minW, innerWidth*0.7);
    prefs.trayW = clamp(prefs.trayW || minW, minW, maxW);
    root.style.setProperty('--trayW', prefs.trayW+'px');
    cols = Math.max(1, Math.floor((prefs.trayW-PADS)/cell));
  } else {
    prefs.trayH = clamp(prefs.trayH || Math.round(innerHeight*0.34), 120, innerHeight*0.75);
    root.style.setProperty('--trayH', prefs.trayH+'px');
    const cellP = prefs.cellP || (innerWidth<700 ? 84 : 110);
    cols = clamp(Math.floor((innerWidth-PADS)/cellP), 1, 14);
  }
  root.style.setProperty('--cols', cols);
  return cols;
}
function stepCols(dir){
  const cols = applyLayout();
  const target = Math.max(1, cols+dir);
  if(!isPortrait()){ prefs.trayW = target*cellL()+PADS; }
  else { prefs.cellP = Math.floor((innerWidth-PADS)/target); }
  applyLayout(); savePrefs(); afterLayout();
}
$('#colsLess').onclick = () => stepCols(-1);
$('#colsMore').onclick = () => stepCols(+1);

let resizing=false;
resizer.addEventListener('pointerdown', e => { resizing=true; resizer.classList.add('drag'); resizer.setPointerCapture(e.pointerId); e.preventDefault(); });
resizer.addEventListener('pointermove', e => {
  if(!resizing) return;
  if(isPortrait()) prefs.trayH = innerHeight - e.clientY - parseFloat(getComputedStyle(root).getPropertyValue('--sab')||0);
  else prefs.trayW = innerWidth - e.clientX;
  applyLayout(); afterLayout();
});
const endResize = () => { if(!resizing) return; resizing=false; resizer.classList.remove('drag'); savePrefs(); };
resizer.addEventListener('pointerup', endResize); resizer.addEventListener('pointercancel', endResize);

function afterLayout(){ if(W && !view.touched) fitView(); }
addEventListener('resize', () => { applyLayout(); afterLayout(); });

/* ================= estado do quebra-cabeça ================= */
let W=0,H=0, cols=0, rows=0, pw=0, ph=0, m=0, T=0, cw=0, ch=0;
let E=null, base=null, pieces=[], grid=[], zTop=10, placed=0, buildId=0, current=null;
let timer=null, t0=0, completed=false;
const view = {x:0,y:0,k:1,touched:false};
const hitCtx = document.createElement('canvas').getContext('2d');

function applyView(){ world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function fitView(){
  const r = stage.getBoundingClientRect();
  const k = Math.min(r.width*0.82/W, r.height*0.82/H);
  view.k = k; view.x = (r.width-W*k)/2; view.y = (r.height-H*k)/2; view.touched=false; applyView();
}
function zoomAt(cx,cy,f){
  const r = stage.getBoundingClientRect(), px=cx-r.left, py=cy-r.top;
  const fitK = Math.min(r.width*0.82/W, r.height*0.82/H);
  const nk = clamp(view.k*f, fitK*0.25, 5), ff = nk/view.k;
  view.x = px-(px-view.x)*ff; view.y = py-(py-view.y)*ff; view.k = nk; view.touched=true; applyView();
}
const toWorld = (cx,cy) => { const r=stage.getBoundingClientRect(); return {x:(cx-r.left-view.x)/view.k, y:(cy-r.top-view.y)/view.k}; };

/* ---------- forma das peças ---------- */
const CURVE = [[.43,.01,.44,.06,.43,.10],[.40,.14,.30,.27,.50,.27],[.70,.27,.60,.14,.57,.10],[.56,.06,.57,.01,.62,0]];
function edge(p,ax,ay,bx,by,s){
  if(!s){ p.lineTo(bx,by); return; }
  const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=uy, ny=-ux;
  const X=(u,v)=>ax+ux*u*L+nx*v*T*s, Y=(u,v)=>ay+uy*u*L+ny*v*T*s;
  p.lineTo(X(.38,0),Y(.38,0));
  for(const q of CURVE) p.bezierCurveTo(X(q[0],q[1]),Y(q[0],q[1]),X(q[2],q[3]),Y(q[2],q[3]),X(q[4],q[5]),Y(q[4],q[5]));
  p.lineTo(bx,by);
}
function buildPath(r,c){
  const p=new Path2D(), x0=m,y0=m,x1=m+pw,y1=m+ph;
  p.moveTo(x0,y0);
  edge(p,x0,y0,x1,y0,-E.H[r][c]);
  edge(p,x1,y0,x1,y1, E.V[r][c+1]);
  edge(p,x1,y1,x0,y1, E.H[r+1][c]);
  edge(p,x0,y1,x0,y0,-E.V[r][c]);
  p.closePath(); return p;
}
function makeEdges(){
  const rs=()=>Math.random()<.5?1:-1, Hh=[], Vv=[];
  for(let r=0;r<=rows;r++){ Hh[r]=[]; for(let c=0;c<cols;c++) Hh[r][c]=(r===0||r===rows)?0:rs(); }
  for(let r=0;r<rows;r++){ Vv[r]=[]; for(let c=0;c<=cols;c++) Vv[r][c]=(c===0||c===cols)?0:rs(); }
  return {H:Hh,V:Vv};
}
function pickGrid(n,a){
  let best=null;
  for(let c=2;c<=70;c++){
    const r=Math.max(2,Math.round(c/a)), cnt=c*r, sq=Math.abs(a*r/c-1), score=Math.abs(cnt-n)/n+sq*.5;
    if(!best||score<best.score) best={c,r,cnt,score};
  }
  return best;
}

function makePiece(r,c){
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d'), path=buildPath(r,c);
  const ox=c*pw-m, oy=r*ph-m;
  ctx.save(); ctx.clip(path);
  const ix0=Math.max(0,ox), iy0=Math.max(0,oy), ix1=Math.min(W,ox+cw), iy1=Math.min(H,oy+ch);
  ctx.drawImage(base, ix0,iy0,ix1-ix0,iy1-iy0, ix0-ox,iy0-oy,ix1-ix0,iy1-iy0);
  ctx.restore();
  ctx.lineJoin='round'; ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.stroke(path);
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.save(); ctx.translate(-.8,-.8); ctx.clip(path); ctx.stroke(path); ctx.restore();
  cv.draggable=false;
  const p={r,c,el:cv,path,state:'tray',x:0,y:0,z:0,tx:c*pw-m,ty:r*ph-m,rot:0,deg:0,g:null};
  p.g={pieces:[p],locked:false};
  cv._piece=p; cv.className='tp';
  return p;
}

/* ---------- construir ---------- */
const nextFrame = () => new Promise(r => setTimeout(r,0));
async function buildPuzzle(img, n, info){
  const id = ++buildId;
  clearBoard();
  const nw=img.naturalWidth, nh=img.naturalHeight;
  const long = clamp(Math.max(nw,nh),1000,2000), sc = long/Math.max(nw,nh);
  W=Math.round(nw*sc); H=Math.round(nh*sc);
  base=document.createElement('canvas'); base.width=W; base.height=H;
  const bctx=base.getContext('2d'); bctx.imageSmoothingQuality='high'; bctx.drawImage(img,0,0,W,H);
  const g=pickGrid(n,W/H); cols=g.c; rows=g.r;
  pw=W/cols; ph=H/rows; T=Math.min(pw,ph); m=Math.ceil(T*.30)+3;
  cw=Math.ceil(pw+2*m); ch=Math.ceil(ph+2*m);
  E=makeEdges();
  frame.style.width=W+'px'; frame.style.height=H+'px';
  base.id='ghost'; base.style.width=W+'px'; base.style.height=H+'px'; frame.after(base);
  trayEl.classList.toggle('few', cols*rows<=200);
  const list=[]; const total=cols*rows;
  let last=performance.now();
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    list.push(makePiece(r,c));
    if(performance.now()-last>30){ setLoading(`Cortando peças… ${list.length}/${total}`, list.length/total); await nextFrame(); last=performance.now(); if(id!==buildId) return; }
  }
  pieces=list; grid=list; placed=0; completed=false; zTop=10; rotMode=!!prefs.rotate;
  if(rotMode) list.forEach(p=>{ p.deg=90*Math.floor(Math.random()*4); p.rot=p.deg%360; applyRot(p); });
  const order=list.slice(); for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  const frag=document.createDocumentFragment(); order.forEach(p=>frag.appendChild(p.el)); trayList.appendChild(frag);
  current={img,n,info};
  $('#hudTotal').textContent=total; updateHud();
  world.classList.remove('complete');
  document.body.classList.toggle('guide', !!prefs.guide); $('#btnGuide').classList.toggle('on', !!prefs.guide);
  applyLayout(); fitView();
  startTimer();
}
function clearBoard(){
  stopTimer();
  pieces.forEach(p=>p.el.remove()); pieces=[]; trayList.textContent='';
  const g=$('#ghost'); if(g) g.remove();
  world.classList.remove('complete'); dragLayer.textContent='';
  drag=null; pending=null; lastTap=null; grid=[]; W=0; $('#hudPlaced').textContent='0'; $('#hudTotal').textContent='0';
}

/* ---------- HUD / tempo ---------- */
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function startTimer(){ stopTimer(); t0=Date.now(); $('#hudTime').textContent='0:00'; timer=setInterval(()=>{ $('#hudTime').textContent=fmt(Math.floor((Date.now()-t0)/1000)); },1000); }
function stopTimer(){ clearInterval(timer); timer=null; }
function updateHud(){
  $('#hudPlaced').textContent=placed;
  const inTray=pieces.filter(p=>p.state==='tray').length;
  $('#trayCount').textContent=inTray;
  let empty=$('#trayEmpty');
  if(!inTray && pieces.length){ if(!empty){ empty=document.createElement('div'); empty.id='trayEmpty'; empty.textContent='Todas as peças estão no quadro.'; trayList.appendChild(empty);} }
  else if(empty) empty.remove();
}

/* ================= arrastar peças ================= */
let drag=null, pending=null, lastTap=null, rotMode=false;
const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
const overTray = (x,y) => { const r=trayEl.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; };
const pieceAt = (r,c) => (r<0||c<0||r>=rows||c>=cols) ? null : grid[r*cols+c];
const applyRot = p => { p.el.style.transform = p.deg ? `rotate(${p.deg}deg)` : ''; };

/* toque duplo = girar (só no modo "girar peças") */
function noteTap(p){
  const now=performance.now();
  if(lastTap && lastTap.p===p && now-lastTap.t<400){ lastTap=null; if(rotMode) rotatePiece(p); }
  else lastTap={p,t:now};
}
function rotatePiece(p){
  if(p.g.pieces.length>1 || p.state==='locked') return;
  p.deg+=90; p.rot=((p.deg%360)+360)%360; applyRot(p);
  if(p.state==='world') snapGroup(p.g);
}

trayList.addEventListener('contextmenu', e=>e.preventDefault());
trayList.addEventListener('pointerdown', e => {
  const el=e.target.closest('canvas.tp'); if(!el || drag) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const pd={p:el._piece,id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,type:e.pointerType,timer:null};
  pending=pd;
  if(e.pointerType!=='mouse') pd.timer=setTimeout(()=>{ if(pending===pd){ navigator.vibrate&&navigator.vibrate(12); beginTrayDrag(pd); } },230);
  if(e.pointerType==='mouse') e.preventDefault();
});
document.addEventListener('touchmove', e => { if(drag) e.preventDefault(); }, {passive:false});

function cancelPending(){ if(pending){ clearTimeout(pending.timer); pending=null; } }
function beginTrayDrag(pd){
  clearTimeout(pd.timer); pending=null;
  const p=pd.p, src=p.el, rect=src.getBoundingClientRect();
  const dw=cw*view.k, dh=ch*view.k, ratio=dw/src.offsetWidth;
  const ghost=document.createElement('canvas'); ghost.width=cw; ghost.height=ch; ghost.getContext('2d').drawImage(src,0,0);
  ghost.className='floating'; ghost.style.width=dw+'px'; ghost.style.height=dh+'px';
  if(p.deg) ghost.style.transform=`rotate(${p.deg}deg)`;
  const ox=(pd.x-(rect.left+rect.width/2))*ratio, oy=(pd.y-(rect.top+rect.height/2))*ratio;
  ghost.style.left=(pd.x-ox-dw/2)+'px'; ghost.style.top=(pd.y-oy-dh/2)+'px';
  dragLayer.appendChild(ghost); src.classList.add('src');
  drag={mode:'float',p,id:pd.id,ghost,ox,oy,dw,dh};
}
function startWorldDrag(p,e){
  const g=p.g, w=toWorld(e.clientX,e.clientY); zTop++;
  g.pieces.forEach(q=>{ q.z=zTop; q.el.style.zIndex=zTop; q.el.classList.add('lift'); q.sx=q.x; q.sy=q.y; });
  drag={mode:'world',p,g,id:e.pointerId,gx:w.x,gy:w.y,sx:e.clientX,sy:e.clientY};
}
addEventListener('pointermove', e => {
  if(drag && e.pointerId===drag.id){
    if(drag.mode==='float'){ drag.ghost.style.left=(e.clientX-drag.ox-drag.dw/2)+'px'; drag.ghost.style.top=(e.clientY-drag.oy-drag.dh/2)+'px'; }
    else {
      const w=toWorld(e.clientX,e.clientY), dx=w.x-drag.gx, dy=w.y-drag.gy;
      for(const q of drag.g.pieces){ q.x=q.sx+dx; q.y=q.sy+dy; q.el.style.left=q.x+'px'; q.el.style.top=q.y+'px'; }
    }
    trayEl.classList.toggle('drop', overTray(e.clientX,e.clientY));
    return;
  }
  if(pending && e.pointerId===pending.id){
    pending.x=e.clientX; pending.y=e.clientY;
    const dx=e.clientX-pending.sx, dy=e.clientY-pending.sy, d=Math.hypot(dx,dy);
    if(pending.type==='mouse'){ if(d>4) beginTrayDrag(pending); }
    else if(d>9){ if(Math.abs(dx)>Math.abs(dy)*1.1) beginTrayDrag(pending); else cancelPending(); }
  }
});
function restoreGroup(g){ for(const q of g.pieces){ q.x=q.sx; q.y=q.sy; q.el.style.left=q.x+'px'; q.el.style.top=q.y+'px'; } }
function endDrag(e,cancel){
  if(pending && e.pointerId===pending.id){
    const t=pending; cancelPending();
    if(!cancel && Math.hypot(e.clientX-t.sx,e.clientY-t.sy)<8) noteTap(t.p);
  }
  if(!drag || e.pointerId!==drag.id) return;
  const d=drag; drag=null; trayEl.classList.remove('drop');
  const over=!cancel && overTray(e.clientX,e.clientY);
  if(d.mode==='float'){
    const p=d.p, left=parseFloat(d.ghost.style.left), top=parseFloat(d.ghost.style.top);
    d.ghost.remove(); p.el.classList.remove('src');
    if(over||cancel) return;
    const r=stage.getBoundingClientRect();
    placeInWorld(p,(left-r.left-view.x)/view.k,(top-r.top-view.y)/view.k);
  } else {
    const g=d.g; g.pieces.forEach(q=>q.el.classList.remove('lift'));
    const moved=Math.hypot(e.clientX-d.sx,e.clientY-d.sy);
    if(cancel || moved<6 || (over && g.pieces.length>1)){ restoreGroup(g); if(!cancel && moved<6) noteTap(d.p); return; }
    if(over) returnToTray(d.p); else snapGroup(g);
  }
}
addEventListener('pointerup', e=>endDrag(e,false));
addEventListener('pointercancel', e=>endDrag(e,true));

function placeInWorld(p,x,y){
  p.state='world'; p.x=x; p.y=y; p.z=++zTop;
  const el=p.el; el.className='wp';
  el.style.cssText=`width:${cw}px;height:${ch}px;left:${x}px;top:${y}px;z-index:${p.z}`;
  applyRot(p); world.appendChild(el); updateHud(); snapGroup(p.g);
}
function returnToTray(p){
  p.state='tray'; const el=p.el; el.className='tp'; el.style.cssText=''; applyRot(p);
  trayList.appendChild(el); updateHud();
  const e=$('#trayEmpty'); if(e) trayList.appendChild(e);
}
/* guarda na bandeja só as peças soltas (grupos e peças já no lugar ficam) */
function tidy(){
  const loose=pieces.filter(p=>p.state==='world' && p.g.pieces.length===1);
  loose.forEach(returnToTray);
  toast(loose.length ? `${loose.length} ${loose.length===1?'peça guardada':'peças guardadas'} na bandeja.` : 'Não há peças soltas isoladas no quadro.', 2200);
}
$('#btnTidy').onclick=()=>{ if(W) tidy(); };

/* ---------- grupos (peças aglutinadas) ---------- */
function moveGroup(g,dx,dy){ for(const q of g.pieces){ q.x+=dx; q.y+=dy; q.el.style.left=q.x+'px'; q.el.style.top=q.y+'px'; } }
function mergeGroups(a,b){
  const z=Math.max(...a.pieces.map(q=>q.z),...b.pieces.map(q=>q.z));
  for(const q of b.pieces){ q.g=a; a.pieces.push(q); }
  a.locked=a.locked||b.locked;
  for(const q of a.pieces){ q.z=z; if(q.state!=='locked') q.el.style.zIndex=z; }
  return a;
}
function lockGroup(g){
  g.locked=true;
  for(const q of g.pieces){
    const was=q.state==='locked';
    q.state='locked'; q.x=q.tx; q.y=q.ty; const el=q.el;
    el.style.left=q.tx+'px'; el.style.top=q.ty+'px'; el.style.zIndex=1;
    if(!was){ placed++; el.classList.add('locked','flash'); setTimeout(()=>el.classList.remove('flash'),260); }
  }
  updateHud();
  if(placed===pieces.length) complete();
}
function snapGroup(g){
  if(g.locked || g.pieces.some(q=>q.rot!==0)) return;
  const thr=Math.min(pw,ph)*.35;
  // 1) encaixe na posição certa do quadro
  let best=null;
  for(const q of g.pieces){ const d=Math.hypot(q.x-q.tx,q.y-q.ty); if(d<=thr && (!best||d<best.d)) best={q,d}; }
  if(best){ moveGroup(g,best.q.tx-best.q.x,best.q.ty-best.q.y); lockGroup(g); return; }
  // 2) junção com peças vizinhas, em qualquer lugar da mesa
  for(;;){
    let found=null;
    outer: for(const q of g.pieces){
      for(const [dr,dc] of DIRS){
        const n=pieceAt(q.r+dr,q.c+dc);
        if(!n || n.g===g || n.state==='tray' || n.rot!==0) continue;
        const ex=(n.x-n.tx)-(q.x-q.tx), ey=(n.y-n.ty)-(q.y-q.ty);
        if(Math.hypot(ex,ey)<=thr){ found={n,ex,ey}; break outer; }
      }
    }
    if(!found) break;
    moveGroup(g,found.ex,found.ey);
    g=mergeGroups(g,found.n.g);
    g.pieces.forEach(q=>{ if(q.state!=='locked'){ q.el.classList.add('flash'); setTimeout(()=>q.el.classList.remove('flash'),260);} });
    if(g.locked){ lockGroup(g); break; }
  }
}

function complete(){
  completed=true; stopTimer();
  const secs=Math.floor((Date.now()-t0)/1000);
  world.classList.add('complete');
  $('#doneStats').textContent=`${pieces.length} peças`+(prefs.showTime?` em ${fmt(secs)}`:'')+'.';

  setTimeout(()=>{ if(completed) $('#done').hidden=false; },1100);
}

/* ================= pan / zoom do quadro ================= */
const pointers=new Map();
stage.addEventListener('pointerdown', e => {
  if(!W || drag || e.target.closest('#hud')) return;
  if(e.pointerType==='mouse' && e.button!==0 && e.button!==1) return;
  if(pointers.size===0 && e.button!==1){
    const w=toWorld(e.clientX,e.clientY), p=hitTest(w.x,w.y,e.pointerType!=='mouse');
    if(p){ startWorldDrag(p,e); e.preventDefault(); return; }
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ stage.setPointerCapture(e.pointerId); }catch{}
});
stage.addEventListener('pointermove', e => {
  const s=pointers.get(e.pointerId); if(!s) return;
  if(pointers.size===1){ view.x+=e.clientX-s.x; view.y+=e.clientY-s.y; view.touched=true; applyView(); s.x=e.clientX; s.y=e.clientY; return; }
  const arr=[...pointers.values()], c0={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2}, d0=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
  s.x=e.clientX; s.y=e.clientY;
  const c1={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2}, d1=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
  view.x+=c1.x-c0.x; view.y+=c1.y-c0.y; view.touched=true;
  if(d0>0) zoomAt(c1.x,c1.y,d1/d0); else applyView();
});
const stageUp = e => pointers.delete(e.pointerId);
stage.addEventListener('pointerup', stageUp); stage.addEventListener('pointercancel', stageUp);
stage.addEventListener('wheel', e => {
  if(!W) return; e.preventDefault();
  const dy=e.deltaY*(e.deltaMode===1?30:1);
  zoomAt(e.clientX,e.clientY,Math.exp(-dy*(e.ctrlKey?0.01:0.0015)));
},{passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ponto do mundo -> coordenadas locais da peça (considera a rotação) */
function localPt(p,wx,wy){
  let lx=wx-p.x, ly=wy-p.y;
  if(p.rot){
    const cx=cw/2, cy=ch/2, dx=lx-cx, dy=ly-cy, a=-p.rot*Math.PI/180, co=Math.cos(a), si=Math.sin(a);
    lx=cx+dx*co-dy*si; ly=cy+dx*si+dy*co;
  }
  return [lx,ly];
}
function hitTest(wx,wy,touch){
  let best=null;
  for(const p of pieces){
    if(p.state!=='world') continue;
    const [lx,ly]=localPt(p,wx,wy); if(lx<0||ly<0||lx>cw||ly>ch) continue;
    if(hitCtx.isPointInPath(p.path,lx,ly) && (!best||p.z>best.z)) best=p;
  }
  if(!best && touch){
    for(const p of pieces){
      if(p.state!=='world') continue;
      const [lx,ly]=localPt(p,wx,wy);
      if(lx>=m&&lx<=m+pw&&ly>=m&&ly<=m+ph&&(!best||p.z>best.z)) best=p;
    }
  }
  return best;
}

/* ================= bancos de imagens ================= */
async function getJSON(url){
  let lastErr;
  for(let i=0;i<2;i++){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000);
    try{
      const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
      if(r.ok) return await r.json();
      lastErr=new Error('HTTP '+r.status);
      if(r.status<500 && r.status!==429) throw lastErr;       // erro do pedido: não adianta repetir
    }catch(e){
      clearTimeout(to);
      lastErr = e.name==='AbortError' ? new Error('tempo esgotado') : (e.message==='Failed to fetch'||e.name==='TypeError' ? new Error('sem resposta (rede ou bloqueio do servidor)') : e);
      if(/^HTTP 4/.test(lastErr.message) && !/429/.test(lastErr.message)) throw lastErr;
    }
    await new Promise(r=>setTimeout(r,600));
  }
  throw lastErr;
}
const withParams = (base,params) => { const u=new URL(base); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); return u; };
const stripHtml = s => { if(!s) return ''; const d=new DOMParser().parseFromString(s,'text/html'); return (d.body.textContent||'').trim(); };
const loadImage = url => new Promise((res,rej)=>{ const i=new Image(); i.referrerPolicy='no-referrer'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=url; });
const PAGE = 24, PAGE_OV = 20;      // Openverse anônimo aceita no máximo 20 por página
const smallScreen=()=>innerWidth<900;
const httpsU = u => (u||'').replace(/^http:/,'https:').replace(/ /g,'%20');

/* --- Wikimedia Commons --- */
const commonsQuery = params => getJSON(withParams('https://commons.wikimedia.org/w/api.php',{action:'query',format:'json',origin:'*',formatversion:'2',...params}));
const SAFE='-nude -naked -topless -erotic -sex';
async function searchCommons(term, offset, featured){
  const q=`${term} filetype:bitmap ${SAFE}`+(featured?' incategory:"Featured pictures on Wikimedia Commons"':'');
  const d=await commonsQuery({generator:'search',gsrnamespace:6,gsrsearch:q,gsrlimit:PAGE,gsroffset:offset,prop:'imageinfo',
    iiprop:'url|size|mime|extmetadata',iiurlwidth:500,iiextmetadatafilter:'LicenseShortName|Artist'});
  const pages=(d.query&&d.query.pages)||[];
  pages.sort((a,b)=>(a.index||0)-(b.index||0));
  const items=[];
  for(const pg of pages){
    const ii=pg.imageinfo&&pg.imageinfo[0]; if(!ii) continue;
    if(!/^image\/(jpeg|png|webp)$/.test(ii.mime||'')) continue;
    if(ii.width<1000||ii.height<700) continue;
    const md=ii.extmetadata||{}, fileTitle=pg.title;
    items.push({title:fileTitle.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' '),
      thumb:ii.thumburl||ii.url,w:ii.width,h:ii.height,page:ii.descriptionurl,
      credit:[stripHtml(md.Artist&&md.Artist.value).slice(0,60),md.LicenseShortName&&md.LicenseShortName.value].filter(Boolean).join(' · '),
      candidates:async()=>{ const r=await commonsQuery({titles:fileTitle,prop:'imageinfo',iiprop:'url|size',iiurlwidth:1920}); const x=r.query.pages[0].imageinfo[0]; return [x.thumburl||x.url]; }});
  }
  return {items,next:d.continue&&d.continue.gsroffset!=null?d.continue.gsroffset:null};
}
async function commonsSearch(term,cursor,featured){
  const offset=cursor||0;
  let res=await searchCommons(term,offset,featured);
  if(featured && offset===0 && res.items.length<4){ const r2=await searchCommons(term,0,false); res={items:[...res.items,...r2.items],next:r2.next}; }
  return res;
}

/* --- Art Institute of Chicago (domínio público) --- */
async function aicSearch(term,cursor){
  const page=cursor||1;
  const u=withParams('https://api.artic.edu/api/v1/artworks/search',{q:term,limit:PAGE,page,fields:'id,title,artist_title,image_id,thumbnail,date_display'});
  u.searchParams.set('query[term][is_public_domain]','true');
  const d=await getJSON(u);
  const iiif=(d.config&&d.config.iiif_url)||'https://www.artic.edu/iiif/2';
  const items=(d.data||[]).filter(a=>a.image_id).map(a=>({
    title:a.title||'Sem título', thumb:`${iiif}/${a.image_id}/full/400,/0/default.jpg`,
    w:(a.thumbnail&&a.thumbnail.width)||0, h:(a.thumbnail&&a.thumbnail.height)||0,
    page:`https://www.artic.edu/artworks/${a.id}`, credit:[a.artist_title,'domínio público'].filter(Boolean).join(' · '),
    candidates:async()=>[`${iiif}/${a.image_id}/full/1686,/0/default.jpg`,`${iiif}/${a.image_id}/full/843,/0/default.jpg`]}));
  const tp=d.pagination&&d.pagination.total_pages;
  return {items,next:tp&&page<tp?page+1:null};
}

/* --- Cleveland Museum of Art (CC0) --- */
async function clevelandSearch(term,cursor){
  const skip=cursor||0;
  const d=await getJSON(withParams('https://openaccess-api.clevelandart.org/api/artworks/',{q:term,has_image:1,cc0:1,limit:PAGE,skip}));
  const items=(d.data||[]).filter(a=>a.images&&a.images.web&&a.images.web.url&&(!a.share_license_status||/cc0/i.test(a.share_license_status))).map(a=>{
    const web=a.images.web;
    return {title:a.title||'Sem título',thumb:httpsU(web.url),w:+web.width||0,h:+web.height||0,page:a.url,
      credit:[((a.creators&&a.creators[0]&&a.creators[0].description)||'').split('(')[0].trim(),'CC0'].filter(Boolean).join(' · '),
      candidates:async()=>[httpsU(web.url)]};
  });
  const total=d.info&&d.info.total;
  return {items,next:total&&skip+PAGE<total?skip+PAGE:null};
}

/* --- The Metropolitan Museum of Art (domínio público) --- */
const metCache={term:null,ids:[]};
async function metSearch(term,cursor){
  const off=cursor||0;
  if(metCache.term!==term){
    const d=await getJSON(withParams('https://collectionapi.metmuseum.org/public/collection/v1/search',{q:term,hasImages:'true',isPublicDomain:'true'}));
    metCache.term=term; metCache.ids=d.objectIDs||[];
  }
  const ids=metCache.ids.slice(off,off+PAGE);
  const objs=await Promise.allSettled(ids.map(id=>getJSON(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`)));
  const items=objs.filter(o=>o.status==='fulfilled'&&o.value.primaryImageSmall).map(o=>{
    const a=o.value;
    return {title:a.title||'Sem título',thumb:a.primaryImageSmall,w:0,h:0,page:a.objectURL,
      credit:[a.artistDisplayName,'domínio público'].filter(Boolean).join(' · '),
      candidates:async()=>(smallScreen()||!a.primaryImage)?[a.primaryImageSmall]:[a.primaryImage,a.primaryImageSmall]};
  });
  if(!items.length && objs.length && objs.every(o=>o.status==='rejected')) throw objs[0].reason;
  return {items,next:off+PAGE<metCache.ids.length?off+PAGE:null};
}

/* --- Openverse (várias coleções, licenças Creative Commons / domínio público) --- */
const openverse = category => async (term,cursor) => {
  const page=cursor||1;
  const d=await getJSON(withParams('https://api.openverse.org/v1/images/',{q:term,page,page_size:PAGE_OV,mature:'false',category}));
  const items=(d.results||[]).filter(r=>r.url&&(!r.width||r.width>=700)).map(r=>({
    title:r.title||'Sem título',thumb:r.thumbnail||r.url,w:r.width||0,h:r.height||0,page:r.foreign_landing_url||r.url,
    credit:[r.creator,((r.license||'')+' '+(r.license_version||'')).toUpperCase().trim()].filter(Boolean).join(' · '),
    candidates:async()=>[r.url,r.thumbnail].filter(Boolean)}));
  return {items,next:d.page_count&&page<d.page_count?page+1:null};
};

/* --- NASA Image and Video Library --- */
async function nasaSearch(term,cursor){
  const page=cursor||1;
  const d=await getJSON(withParams('https://images-api.nasa.gov/search',{q:term,media_type:'image',page,page_size:PAGE}));
  const col=d.collection||{};
  const items=(col.items||[]).filter(it=>it.data&&it.data[0]&&it.links&&it.links[0]&&it.links[0].href).map(it=>{
    const mt=it.data[0];
    return {title:mt.title||'Sem título',thumb:httpsU(it.links[0].href),w:0,h:0,
      page:`https://images.nasa.gov/details/${encodeURIComponent(mt.nasa_id)}`,
      credit:[mt.photographer||mt.secondary_creator||'','NASA'].filter(Boolean).join(' · '),
      candidates:async()=>{
        const a=await getJSON(`https://images-api.nasa.gov/asset/${encodeURIComponent(mt.nasa_id)}`);
        const hrefs=((a.collection&&a.collection.items)||[]).map(x=>httpsU(x.href)).filter(h=>/\.(jpe?g|png)$/i.test(h));
        const pick=k=>hrefs.find(h=>h.includes('~'+k+'.'));
        return [pick('large'),pick('medium'),pick('orig'),pick('small')].filter(Boolean);
      }};
  });
  const hasNext=(col.links||[]).some(l=>l.rel==='next');
  return {items,next:hasNext?page+1:null};
}

/* --- SMK · Museu Nacional da Dinamarca (domínio público) --- */
async function smkSearch(term,cursor){
  const off=cursor||0;
  const u=withParams('https://api.smk.dk/api/v1/art/search/',{keys:term||'*',offset:off,rows:PAGE,lang:'en',
    fields:'object_number,titles,production,image_thumbnail,image_width,image_height'});
  u.searchParams.set('filters','[has_image:true],[public_domain:true]');
  const d=await getJSON(u);
  const sized=(url,n)=>/\/full\/![0-9]+,/.test(url)?url.replace(/\/full\/![0-9]+,/,`/full/!${n},`):url;
  const items=(d.items||[]).filter(a=>a.image_thumbnail).map(a=>{
    const t=httpsU(a.image_thumbnail);
    return {title:(a.titles&&a.titles[0]&&a.titles[0].title)||'Sem título',thumb:sized(t,400),w:a.image_width||0,h:a.image_height||0,
      page:`https://open.smk.dk/artwork/image/${a.object_number}`,
      credit:[(a.production&&a.production[0]&&a.production[0].creator)||'','domínio público'].filter(Boolean).join(' · '),
      candidates:async()=>[sized(t,1600),sized(t,1024),t]};
  });
  return {items,next:d.found&&off+PAGE<d.found?off+PAGE:null};
}

/* --- Wellcome Collection (ilustrações médicas e botânicas, mapas, gravuras; licenças abertas) --- */
async function wellcomeSearch(term,cursor){
  const page=cursor||1;
  const d=await getJSON(withParams('https://api.wellcomecollection.org/catalogue/v2/images',{query:term,page,pageSize:PAGE}));
  const items=(d.results||[]).filter(r=>r.thumbnail&&r.thumbnail.url).map(r=>{
    const base=httpsU(r.thumbnail.url).replace(/\/info\.json$/,'');
    const ar=r.aspectRatio, lic=(r.thumbnail.license&&r.thumbnail.license.label)||'';
    return {title:(r.source&&r.source.title)||'Sem título',thumb:`${base}/full/400,/0/default.jpg`,w:ar?Math.round(1000*ar):0,h:ar?1000:0,
      page:`https://wellcomecollection.org/works/${(r.source&&r.source.id)||''}`,
      credit:[(r.thumbnail.credit||'').slice(0,60),lic].filter(Boolean).join(' · '),
      candidates:async()=>[`${base.replace('/thumbs/','/image/')}/full/1600,/0/default.jpg`,`${base}/full/1000,/0/default.jpg`,`${base}/full/640,/0/default.jpg`]};
  });
  return {items,next:d.nextPage?page+1:null};
}

/* --- todas as galerias ao mesmo tempo --- */
async function allSearch(term,cursor){
  const cur=cursor||{};
  const ids=REAL_IDS.filter(id=>cur[id]!==null);
  const res=await Promise.allSettled(ids.map(id=>PROVIDERS[id].search(term,cur[id])));
  const next={}, lists=[], failed=[];
  ids.forEach((id,i)=>{
    const r=res[i];
    if(r.status==='fulfilled'){ next[id]=r.value.next; lists.push(r.value.items.map(it=>({...it,credit:[it.credit,PROVIDERS[id].short].filter(Boolean).join(' · '),src:PROVIDERS[id].short}))); }
    else { next[id]=null; failed.push(`${PROVIDERS[id].short} (${r.reason&&r.reason.message||'erro'})`); }
  });
  if(failed.length===ids.length) throw new Error(failed.join('; '));
  const items=[], seen=new Set(); let more=true;
  for(let i=0;more;i++){ more=false; for(const l of lists){ if(i<l.length){ more=true; if(!seen.has(l[i].thumb)){ seen.add(l[i].thumb); items.push(l[i]); } } } }
  const merged={...cur,...next};
  return {items,next:Object.values(merged).some(v=>v!=null&&v!==undefined)?merged:null,failed};
}

function translate(q){
  const norm=q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  if(/por do sol/.test(norm)) return norm.replace(/por do sol/g,'sunset');
  return norm.split(/\s+/).map(w=>PT[w]!==undefined?PT[w]:w).filter(Boolean).join(' ');
}

const G={term:'',cursor:undefined,items:[],loading:false,seq:0};

async function loadGallery(term,reset){
  if(G.loading && !reset) return;
  const my=++G.seq; G.loading=true;
  if(reset){ G.term=term; G.cursor=undefined; G.items=[]; $('#grid').textContent=''; }
  const eff=G.term||prov().def;
  $('#gstatus').textContent='Carregando…'; $('#btnMore').hidden=true;
  try{
    let res, tries=0, failed=[];
    do{ res=await prov().search(eff,G.cursor); if(my!==G.seq) return; G.cursor=res.next; failed=failed.concat(res.failed||[]); tries++; }
    while(!res.items.length && res.next!=null && tries<4);
    G.items.push(...res.items); renderGrid(res.items);
    let msg=G.items.length?'':'Nenhuma imagem encontrada. Tente outro termo (em inglês costuma funcionar melhor) ou outra galeria.';
    if(failed.length) msg=(msg?msg+' ':'')+'Não responderam: '+[...new Set(failed)].join('; ')+'.';
    $('#gstatus').textContent=msg;
    $('#btnMore').hidden=res.next==null||!res.items.length;
  }catch(err){
    if(my!==G.seq) return;
    $('#gstatus').textContent=`Não foi possível carregar “${prov().short}”: ${err.message}. Tente “Testar galerias”, escolha outra galeria ou envie a sua própria imagem.`;
  }finally{ if(my===G.seq) G.loading=false; }
}
function renderGrid(items){
  const grid=$('#grid');
  for(const it of items){
    const b=document.createElement('button'); b.className='th'; b.title=it.title; b.type='button';
    const im=document.createElement('img'); im.loading='lazy'; im.referrerPolicy='no-referrer'; im.alt=it.title; im.src=it.thumb; b.appendChild(im);
    b.onclick=()=>selectItem(it,b); grid.appendChild(b);
  }
}
function setSelection(sel){
  selection=sel;
  $('#selThumb').src=sel.thumb; $('#selTitle').textContent=sel.title;
  const c=$('#selCredit'); c.textContent='';
  if(sel.page){ const a=document.createElement('a'); a.href=sel.page; a.target='_blank'; a.rel='noopener'; a.textContent=sel.credit||'Ver origem'; c.appendChild(a); }
  else c.textContent='Sua imagem';
  $('#btnStart').disabled=false; updateCountLabel();
}
function selectItem(it,btn){
  document.querySelectorAll('.th.sel').forEach(x=>x.classList.remove('sel')); if(btn) btn.classList.add('sel');
  setSelection({...it,getImage:async()=>{
    const urls=await it.candidates();
    for(const u of urls){ try{ return await loadImage(u); }catch{} }
    throw new Error('sem imagem');
  }});
}

  $('#chips').appendChild(b);
});

/* --- sorteio --- */
let randBusy=false;
async function pickRandom(surprise){
  if(randBusy) return; randBusy=true;
  const btns=[$('#btnRandom'),$('#btnRandomAll')], olds=btns.map(b=>b.textContent);
  btns.forEach(b=>b.disabled=true); (surprise?btns[1]:btns[0]).textContent='Sorteando…';
  let lastErr=null;
  try{
    for(let tries=0;tries<6;tries++){
      let pr, term;
      if(surprise){ pr=PROVIDERS[REAL_IDS[rc(REAL_IDS.length)]]; term=pr.terms[rc(pr.terms.length)]; }       // qualquer galeria, qualquer tema
      else { pr=prov(); term=prefs.query||pr.terms[rc(pr.terms.length)]; }                                      // galeria e busca atuais
      let res;
      try{ res=await pr.search(term, tries%2===0 ? pr.rand() : undefined); }catch(e){ lastErr=e; continue; }
      if(res.items.length){
        const it=res.items[rc(res.items.length)];
        selectItem(it,null);
        toast(`Sorteada${surprise?` (${pr.short})`:''}: ${it.title}`,2800); return;
      }
    }
    toast(lastErr?`Não consegui sortear: ${lastErr.message}. Use “Testar galerias” ou tente outra galeria.`:'Nenhuma imagem encontrada com esses filtros. Tente outro termo ou galeria.',5000);
  }finally{ btns.forEach((b,i)=>{ b.disabled=false; b.textContent=olds[i]; }); randBusy=false; }
}
$('#btnRandom').onclick=()=>pickRandom(false);
$('#btnRandomAll').onclick=()=>pickRandom(true);

/* --- teste de conexão das galerias --- */
$('#btnDiag').onclick=async()=>{
  const box=$('#diag'); box.hidden=false; box.textContent='Testando as galerias…';
  const rows=await Promise.all(REAL_IDS.map(async id=>{
    const t=performance.now();
    try{ const r=await PROVIDERS[id].search('cat'); return `✓ ${PROVIDERS[id].short}: ${r.items.length} imagens (${Math.round(performance.now()-t)} ms)`; }
    catch(e){ return `✗ ${PROVIDERS[id].short}: ${e.message}`; }
  }));
  box.textContent=''; rows.forEach(t=>{ const d=document.createElement('div'); d.textContent=t; box.appendChild(d); });
};

/* --- upload --- */
async function handleFile(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('Esse arquivo não parece ser uma imagem.'); return; }
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImage(url);
    setSelection({kind:'file',title:file.name.replace(/\.[^.]+$/,''),thumb:url,w:img.naturalWidth,h:img.naturalHeight,getImage:async()=>img});
  }catch{ toast('Não consegui abrir essa imagem (formato não suportado pelo navegador).'); }
}
$('#file').onchange=e=>{ handleFile(e.target.files[0]); e.target.value=''; };
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
addEventListener('dragover',e=>e.preventDefault()); addEventListener('drop',e=>e.preventDefault());

/* --- começar --- */
$('#btnStart').onclick=async()=>{
  if(!selection) return;
  if(W && !completed && placed>0 && !confirm('Descartar o quebra-cabeça atual e começar outro?')) return;
  showLoading('Carregando imagem…');
  try{
    const img=await selection.getImage();
    await buildPuzzle(img,COUNTS[prefs.countIdx],selection);
    hideMenu();
  }catch(err){ console.error(err); toast('Não foi possível carregar essa imagem. Tente outra.'); }
  finally{ hideLoading(); }
};

/* ================= PWA ================= */
let deferredPrompt=null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(!standalone) $('#btnInstall').hidden=false; });
addEventListener('appinstalled',()=>{ $('#btnInstall').hidden=true; $('#btnIosHint').hidden=true; deferredPrompt=null; });
$('#btnInstall').onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('#btnInstall').hidden=true; };
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS && !standalone) $('#btnIosHint').hidden=false;
$('#btnIosHint').onclick=()=>toast('Para instalar: toque em Compartilhar e depois em “Adicionar à Tela de Início”.',7000);
if('serviceWorker' in navigator && location.protocol!=='file:') addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ================= início ================= */
applyLayout();
applyTheme(); applyTimeVis();
$('#optRotate').checked=!!prefs.rotate;
$('#optRotate').onchange=e=>{ prefs.rotate=e.target.checked; savePrefs(); };
updateCountLabel();
showMenu();
$('#q').value='';
markChip(prefs.query);
loadGallery(prefs.query||'landscape',true);

/* gancho para testes automatizados */
window.__puzzle = {buildPuzzle, get pieces(){return pieces;}, get view(){return view;}, get state(){return {W,H,cols,rows,pw,ph,m,placed};}, toWorld, hideMenu};
})();
</script>
